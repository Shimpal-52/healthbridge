<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HealthBridge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            color: #1677c8;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1677c8;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 18px;
            color: #1677c8;
            text-decoration: none;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1677c8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d5fa5;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .register a,
        .home {
            color: #1677c8;
            text-decoration: none;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">HealthBridge</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to access your healthcare account
        </p>

        <form method="POST">
            {% csrf_token %}

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <a href="#" class="forgot">Forgot Password?</a>

            <button type="submit">Login</button>
        </form>

        <p class="register">
            Don't have an account?
            <a href="#">Create Account</a>
        </p>

        <a href="/" class="home">← Back to Home</a>

    </div>

</body>
</html>
