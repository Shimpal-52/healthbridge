<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - HealthBridge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f7f7, #dceeff);
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .register-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #087f8c;
            font-size: 32px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #087f8c;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #087f8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066b76;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #087f8c;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <div class="logo">
                <h1>HealthBridge</h1>
                <p>Your Healthcare, Connected in One Place</p>
            </div>

            <h2>Create Your Account</h2>

            <p class="subtitle">
                Register to access healthcare services
            </p>

            <form method="POST">
                {% csrf_token %}

                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Phone Number</label>
                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <label>Account Type</label>
                <select name="account_type" required>
                    <option value="">Select account type</option>
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="hospital">Hospital</option>
                </select>

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label>Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </div>

        </div>

    </div>

</body>
</html>
