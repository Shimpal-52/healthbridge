<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | HealthBridge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eaf6ff, #f4fbff);
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 450px;
        }

        .forgot-card {
            background: white;
            padding: 42px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #1769aa;
            margin-bottom: 25px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d5dce3;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.10);
        }

        .reset-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #1976d2, #0d8bdc);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(25, 118, 210, 0.25);
        }

        .back-login {
            display: inline-block;
            margin-top: 25px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            color: #1976d2;
        }

        .success-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #eaf8ef;
            color: #238044;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .forgot-card {
                padding: 32px 24px;
                border-radius: 15px;
            }

            .logo {
                font-size: 28px;
            }

            .icon {
                width: 62px;
                height: 62px;
                font-size: 28px;
            }

            h1 {
                font-size: 24px;
            }

            .description {
                font-size: 14px;
            }

            input,
            .reset-btn {
                height: 48px;
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {

            .forgot-card {
                padding: 28px 18px;
            }

            .logo {
                font-size: 25px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <!-- Logo -->
            <div class="logo">
                HealthBridge
            </div>

            <!-- Icon -->
            <div class="icon">
                🔐
            </div>

            <!-- Heading -->
            <h1>Forgot Password?</h1>

            <p class="description">
                Don't worry! Enter your registered email address
                and we'll help you reset your password.
            </p>

            <!-- Form -->
            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="reset-btn"
                >
                    Send Reset Link
                </button>

            </form>

            <!-- Success message -->
            <div class="success-message" id="successMessage">
                If an account exists with this email,
                password reset instructions will be sent.
            </div>

            <!-- Back to Login -->
            <a
                href="{% url 'login' %}"
                class="back-login"
            >
                ← Back to Login
            </a>

            <!-- Home -->
            <a
                href="{% url 'home' %}"
                class="home-link"
            >
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
